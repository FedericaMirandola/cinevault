name: CineVault CI

on:
  push:
    branches:
      - develop
      - "feature/**"

  pull_request:
    branches:
      - develop

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      TMDB_TOKEN: test-token

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: cinevault
          POSTGRES_USER: cinevault
          POSTGRES_PASSWORD: cinevault123
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cinevault -d cinevault"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run tests
        run: mvn -B test